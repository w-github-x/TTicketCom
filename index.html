<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火车票合并</title>
    <script src="https://cdn.tailwindcss.com"></script>
	<link rel="icon" href="icon.ico" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .a4-preview {
            width: 842px;  /* A4横版宽度：297mm≈842px */
            height: 595px; /* A4横版高度：210mm≈595px */
            margin: 20px auto;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .pdf-page-preview {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: 1px solid #f3f4f6;
            border-radius: 4px;
            background: #fafafa;
        }
        .loading-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .progress-bar {
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-2 text-gray-800">票票合</h1>
        <p class="text-center text-gray-600 mb-8">自动提取每个PDF的第一页，按2列×2行排版（每页4张，A4横版）</p>
        
        <!-- 文件上传区域 -->
        <div class="bg-white rounded-lg shadow-md p-8 mb-8">
            <div class="text-center">
                <label for="pdf-upload" class="inline-block px-8 py-4 bg-blue-500 text-white rounded-lg cursor-pointer hover:bg-blue-600 transition-colors font-medium">
                    📁 选择PDF文件
                </label>
                <input type="file" id="pdf-upload" accept=".pdf" multiple class="hidden">
                <p id="file-count" class="mt-4 text-gray-600">未选择文件</p>
                
                <!-- 进度条 -->
                <div id="progress-container" class="hidden mt-6">
                    <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                        <div id="progress-bar" class="progress-bar bg-blue-500 h-3 rounded-full" style="width: 0%"></div>
                    </div>
                    <p id="progress-text" class="mt-2 text-sm text-gray-600">处理中...</p>
                </div>
            </div>
        </div>

        <!-- 加载动画 -->
        <div id="loading" class="hidden flex flex-col items-center justify-center py-12">
            <div class="loading-spinner"></div>
            <p class="mt-4 text-gray-600">正在处理PDF文件...</p>
        </div>

        <!-- 排版预览区域 -->
        <div id="preview-container" class="hidden">
            <h2 class="text-2xl font-semibold mb-6 text-center text-gray-800">排版预览</h2>
            <div id="preview-content"></div>
        </div>

        <!-- 操作按钮 -->
        <div class="text-center mt-8">
            <button id="download-pdf" class="px-8 py-4 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors font-medium shadow-md hidden disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                ⬇️ 下载合并PDF
            </button>
            <button id="reset-btn" class="ml-4 px-8 py-4 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors font-medium shadow-md hidden">
                🔄 重新选择
            </button>
        </div>
    </div>

    <script>
        // 初始化
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        const { jsPDF } = window.jspdf;
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // 配置：2列×2行，每页4张，A4竖版
        const CONFIG = {
            cols: 2,
            rows: 2,
            perPage: 4,
            marginX: 30,  // 左右边距（30mm = 3厘米）
            marginY: 20,  // 上下边距（20mm = 2厘米）
            gapX: 10,     // 列间距（mm）
            gapY: 10,     // 行间距（mm）
            scale: 3,     // 高质量渲染
            quality: 0.92 // 图片质量
        };

        // DOM元素
        const elements = {
            fileInput: document.getElementById('pdf-upload'),
            fileCount: document.getElementById('file-count'),
            loading: document.getElementById('loading'),
            progressContainer: document.getElementById('progress-container'),
            progressBar: document.getElementById('progress-bar'),
            progressText: document.getElementById('progress-text'),
            previewContainer: document.getElementById('preview-container'),
            previewContent: document.getElementById('preview-content'),
            downloadBtn: document.getElementById('download-pdf'),
            resetBtn: document.getElementById('reset-btn')
        };

        // 状态
        let pdfPagesData = [];

        // 工具函数：更新进度
        function updateProgress(current, total, message = '') {
            const percent = Math.round((current / total) * 100);
            elements.progressBar.style.width = `${percent}%`;
            elements.progressText.textContent = message || `处理中 ${current}/${total} (${percent}%)`;
        }

        // 工具函数：显示错误
        function showError(message) {
            alert(`❌ 错误：${message}`);
            console.error(message);
        }

        // 提取PDF第一页（不缩放）
        async function extractPdfFirstPage(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({ scale: CONFIG.scale });

                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                const context = canvas.getContext('2d');
                await page.render({ canvasContext: context, viewport }).promise;

                return {
                    imgBase64: canvas.toDataURL('image/jpeg', CONFIG.quality),
                    originWidth: viewport.width / CONFIG.scale,
                    originHeight: viewport.height / CONFIG.scale,
                    fileName: file.name
                };
            } catch (error) {
                throw new Error(`处理 ${file.name} 失败：${error.message}`);
            }
        }

        // 生成预览（2×2布局）
        function renderPreview() {
            elements.previewContent.innerHTML = '';
            const totalPages = Math.ceil(pdfPagesData.length / CONFIG.perPage);

            for (let pageIdx = 0; pageIdx < totalPages; pageIdx++) {
                const start = pageIdx * CONFIG.perPage;
                const end = Math.min(start + CONFIG.perPage, pdfPagesData.length);
                const pageData = pdfPagesData.slice(start, end);

                const pageDiv = document.createElement('div');
                pageDiv.className = 'mb-8';
                
                const pageTitle = document.createElement('div');
                pageTitle.className = 'text-center text-sm text-gray-500 mb-2';
                pageTitle.textContent = `第 ${pageIdx + 1} 页 / 共 ${totalPages} 页`;
                pageDiv.appendChild(pageTitle);

                const preview = document.createElement('div');
                preview.className = 'a4-preview';

                // 按从左到右、从上到下的顺序排列
                pageData.forEach((data, idx) => {
                    const img = document.createElement('img');
                    img.className = 'pdf-page-preview';
                    img.src = data.imgBase64;
                    img.alt = data.fileName;
                    img.title = data.fileName;
                    preview.appendChild(img);
                });

                pageDiv.appendChild(preview);
                elements.previewContent.appendChild(pageDiv);
            }
        }

        // 生成PDF（2×2布局，不缩放图片）
        function generatePDF() {
            try {
                elements.downloadBtn.disabled = true;
                elements.downloadBtn.textContent = '⏳ 生成中...';

                const doc = new jsPDF({
                    orientation: 'landscape',  // A4横版
                    unit: 'mm',
                    format: 'a4'
                });

                const a4Width = 297;   // A4横版宽度（mm）
                const a4Height = 210;  // A4横版高度（mm）
                
                // 计算每张图片的可用宽度和高度（考虑边距和间距）
                const availableWidth = a4Width - 2 * CONFIG.marginX - CONFIG.gapX;
                const availableHeight = a4Height - 2 * CONFIG.marginY - CONFIG.gapY;
                const cellWidth = availableWidth / CONFIG.cols;
                const cellHeight = availableHeight / CONFIG.rows;

                pdfPagesData.forEach((page, idx) => {
                    const pageNum = Math.floor(idx / CONFIG.perPage);
                    const localIdx = idx % CONFIG.perPage;
                    const col = localIdx % CONFIG.cols;  // 0或1（左到右）
                    const row = Math.floor(localIdx / CONFIG.cols);  // 0或1（上到下）

                    if (localIdx === 0 && pageNum > 0) {
                        doc.addPage();
                    }

                    // 计算位置（包含间距）
                    const x = CONFIG.marginX + col * (cellWidth + CONFIG.gapX);
                    const y = CONFIG.marginY + row * (cellHeight + CONFIG.gapY);

                    // 不缩放，直接使用原始尺寸（转换为mm）
                    const imgWidthMM = page.originWidth * 0.264583;  // px转mm（96dpi）
                    const imgHeightMM = page.originHeight * 0.264583;

                    // 如果图片超出可用区域，则等比例缩小以适应
                    let finalWidth = imgWidthMM;
                    let finalHeight = imgHeightMM;
                    
                    if (imgWidthMM > cellWidth || imgHeightMM > cellHeight) {
                        const scale = Math.min(cellWidth / imgWidthMM, cellHeight / imgHeightMM);
                        finalWidth = imgWidthMM * scale;
                        finalHeight = imgHeightMM * scale;
                    }

                    // 居中对齐
                    const offsetX = (cellWidth - finalWidth) / 2;
                    const offsetY = (cellHeight - finalHeight) / 2;

                    doc.addImage(
                        page.imgBase64,
                        'JPEG',
                        x + offsetX,
                        y + offsetY,
                        finalWidth,
                        finalHeight
                    );
                });

                // 获取北京时间（UTC+8）
                const now = new Date();
                const beijingTime = new Date(now.getTime() + (8 * 60 * 60 * 1000));
                const timestamp = beijingTime.toISOString().slice(0, 19).replace(/:/g, '-').replace('T', '_');
                doc.save(`合并PDF_${timestamp}.pdf`);

                elements.downloadBtn.disabled = false;
                elements.downloadBtn.textContent = '⬇️ 下载合并PDF';
            } catch (error) {
                showError(`生成PDF失败：${error.message}`);
                elements.downloadBtn.disabled = false;
                elements.downloadBtn.textContent = '⬇️ 下载合并PDF';
            }
        }

        // 重置
        function reset() {
            pdfPagesData = [];
            elements.fileInput.value = '';
            elements.fileCount.textContent = '未选择文件';
            elements.previewContainer.classList.add('hidden');
            elements.downloadBtn.classList.add('hidden');
            elements.resetBtn.classList.add('hidden');
            elements.progressContainer.classList.add('hidden');
        }

        // 处理文件上传
        elements.fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files).filter(f => f.type === 'application/pdf');
            
            if (files.length === 0) {
                showError('请选择至少一个PDF文件');
                return;
            }

            const totalPages = Math.ceil(files.length / CONFIG.perPage);
            elements.fileCount.textContent = `已选择 ${files.length} 个文件（将生成 ${totalPages} 页）`;

            pdfPagesData = [];
            elements.previewContent.innerHTML = '';
            elements.loading.classList.remove('hidden');
            elements.progressContainer.classList.remove('hidden');
            elements.downloadBtn.classList.add('hidden');
            elements.resetBtn.classList.add('hidden');

            try {
                for (let i = 0; i < files.length; i++) {
                    updateProgress(i + 1, files.length, `正在处理：${files[i].name}`);
                    const pageData = await extractPdfFirstPage(files[i]);
                    pdfPagesData.push(pageData);
                }

                elements.loading.classList.add('hidden');
                renderPreview();
                elements.previewContainer.classList.remove('hidden');
                elements.downloadBtn.classList.remove('hidden');
                elements.downloadBtn.disabled = false;
                elements.resetBtn.classList.remove('hidden');
                elements.progressContainer.classList.add('hidden');
            } catch (error) {
                showError(error.message);
                elements.loading.classList.add('hidden');
                elements.progressContainer.classList.add('hidden');
                reset();
            }
        });

        // 事件监听
        elements.downloadBtn.addEventListener('click', generatePDF);
        elements.resetBtn.addEventListener('click', reset);
    </script>
</body>
</html>
